<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf8">
<title>STATION</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='white' stroke='black' stroke-width='2.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=Instrument+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-size:18px}
body{width:100%;height:100dvh;overflow:hidden;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;background:#eeece7}
button,input,textarea,select{font-family:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{outline:none}
a{text-decoration:none;color:inherit}

.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.screen.active{animation:fadeIn 0.18s ease both}

/* ── HOME ─────────────────────────────────────────────── */
#s-home{background:#fafaf8}
.home-header{padding:max(2.6rem,env(safe-area-inset-top)) 2.4rem 0.8rem;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.home-wordmark{font-family:'DM Mono',monospace;font-size:0.74rem;letter-spacing:0.32em;text-transform:uppercase;color:#ccc}
.home-header-right{display:flex;align-items:center;gap:0.6rem}
.home-date{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.14em;color:#ccc}
.home-google-btn{display:inline-flex;align-items:center;gap:0.25rem;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.7rem;border-radius:20px;border:1px solid #ddd;color:#888;cursor:pointer;transition:all 0.15s;background:#fff;-webkit-tap-highlight-color:transparent}
.home-google-btn:hover{border-color:#5a50ff;color:#5a50ff}
.home-google-btn.connected{border-color:#4caf50;color:#4caf50;background:rgba(76,175,80,0.06)}
.home-google-btn svg{width:12px;height:12px;flex-shrink:0}
.home-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:0.6rem 1rem 1.4rem;min-height:0}
.cat-btn{position:relative;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;padding:1.8rem 1.8rem 1.7rem;border:none;-webkit-tap-highlight-color:transparent;transition:transform 0.13s ease;user-select:none;overflow:hidden;cursor:pointer}
.cat-btn:active{transform:scale(0.96)}
.cat-btn.rima{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.07),inset 0 0 0 1px rgba(90,80,255,0.09)}
.cat-btn.home{background:#fdf8f0;box-shadow:0 1px 4px rgba(0,0,0,0.06),inset 0 0 0 1px rgba(180,140,80,0.1)}
.cat-btn.art{background:#f8f8f8;box-shadow:0 1px 4px rgba(0,0,0,0.06),inset 0 0 0 1px rgba(0,0,0,0.06)}
.cat-btn.music{background:#fdf6e8;box-shadow:0 1px 4px rgba(0,0,0,0.06),inset 0 0 0 1px rgba(180,140,60,0.1)}
.rima .btn-accent{background:#5a50ff}.home .btn-accent{background:#c8924a}
.art  .btn-accent{background:#222}   .music .btn-accent{background:#b89440}
.rima .btn-label{color:#1a1830;font-family:'Cormorant Garamond',serif}
.home .btn-label{color:#2a1f10;font-family:'Playfair Display',serif}
.art  .btn-label{color:#111;font-family:'Cormorant Garamond',serif;font-style:italic}
.music .btn-label{color:#241c08;font-family:'Cormorant Garamond',serif;font-style:italic}
.rima .btn-num{color:#e8e8f4}.home .btn-num{color:#eddfc8}
.art  .btn-num{color:#e8e8e8}.music .btn-num{color:#ecdba0}
.rima .btn-badge{background:rgba(90,80,255,0.07);color:#7070cc}
.home .btn-badge{background:rgba(200,146,74,0.08);color:#a07030}
.art  .btn-badge{background:rgba(0,0,0,0.05);color:#999}
.music .btn-badge{background:rgba(180,148,64,0.08);color:#907030}
.btn-num{position:absolute;top:1.2rem;right:1.5rem;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.15em}
.btn-badge{position:absolute;top:1.1rem;left:1.5rem;font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.1em;padding:0.14rem 0.52rem;border-radius:20px}
.btn-accent{width:22px;height:2px;margin-bottom:1rem;border-radius:1px;flex-shrink:0}
.btn-label{font-weight:300;font-size:clamp(2.1rem,4.8vw,3rem);line-height:1;letter-spacing:0.03em}

/* ── TOPBAR ───────────────────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.4rem;flex-shrink:0;border-bottom:1px solid var(--b);background:var(--bg)}
.back-btn{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--tm);padding:0.38rem 0;-webkit-tap-highlight-color:transparent}
.topbar-title{font-family:var(--fhead);font-size:0.95rem;font-weight:400;letter-spacing:0.12em;color:var(--t);display:flex;align-items:center;gap:0.42rem}
.topbar-dot{width:5px;height:5px;border-radius:50%;background:var(--a);flex-shrink:0}
.topbar-actions{display:flex;align-items:center;gap:0.24rem;overflow-x:auto;scrollbar-width:none}
.topbar-actions::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:0.2rem;font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.25rem 0.5rem;border-radius:7px;border:1px solid var(--b);color:var(--tm);cursor:pointer;transition:all 0.14s;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0}
.tb:hover{border-color:var(--a);color:var(--a);background:var(--a-dim)}
.tb.today-btn{border-color:var(--a-dim);color:var(--a);background:var(--a-dim)}
.tb.today-btn.dim{opacity:0.36;pointer-events:none}
.tb.google-connected{border-color:#4caf50;color:#4caf50}

/* ── PILLS ────────────────────────────────────────────── */
.pills-row{display:flex;gap:0.26rem;padding:0.5rem 1.4rem;border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;background:var(--bg)}
.pills-row::-webkit-scrollbar{display:none}
.pill{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.25rem 0.62rem;border-radius:20px;white-space:nowrap;flex-shrink:0;border:1px solid var(--b);color:var(--tm);background:transparent;transition:all 0.14s;-webkit-tap-highlight-color:transparent;cursor:pointer}
.pill.on{background:var(--a-dim);color:var(--a);border-color:transparent}
.pills-sep{width:1px;height:14px;background:var(--b);flex-shrink:0;margin:0 0.1rem}
.proj-group{position:relative;display:inline-flex;align-items:center;gap:1px;flex-shrink:0}
.proj-tab{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.25rem 0.62rem;border-radius:20px;white-space:nowrap;flex-shrink:0;border:1px solid var(--b);color:var(--tm);background:transparent;transition:all 0.14s;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:0.28rem}
.proj-tab.active{background:var(--a-dim);color:var(--a);border-color:transparent}
.proj-tab-add{color:var(--a);border-color:var(--a-dim)}
.proj-plus{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tm);border:1px solid var(--b);background:var(--bg);transition:all 0.14s;font-size:0.72rem;line-height:1;-webkit-tap-highlight-color:transparent}
.proj-plus:hover,.proj-plus.open{color:var(--a);border-color:var(--a);background:var(--a-dim)}

/* ── LAYOUT ───────────────────────────────────────────── */
/* RIMA/HOME: resizable day | week/notes | tasks */
.rh-body{flex:1;overflow:hidden;min-height:0;display:flex}
.rh-col{display:flex;flex-direction:column;overflow:hidden;position:relative}
.col-resizer{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;transition:background 0.15s;z-index:10;align-self:stretch}
.col-resizer:hover,.col-resizer.active{background:var(--a)}

/* ART/MUSIC */
.am-body{flex:1;overflow:hidden;min-height:0;display:flex}
.mobile-tabs{display:none;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--bg)}
.mtab{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.13em;text-transform:uppercase;padding:0.46rem 1rem;border-bottom:2px solid transparent;color:var(--tm);cursor:pointer;transition:all 0.14s}
.mtab.active{color:var(--a);border-bottom-color:var(--a)}
@media(max-width:600px){.mobile-tabs{display:flex!important}}

.col{border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.col:last-child{border-right:none}
.col-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.col-scroll::-webkit-scrollbar{width:3px}
.col-scroll::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.col-head{padding:0.62rem 1rem 0.4rem;border-bottom:1px solid var(--b);background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:0.4rem}
.col-head h3{font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--tm)}

/* ── WEEK/NOTES TABS ──────────────────────────────────── */
.view-tabs{display:flex;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--bg)}
.view-tab{font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.14em;text-transform:uppercase;padding:0.48rem 1rem;border-bottom:2px solid transparent;color:var(--tm);cursor:pointer;transition:all 0.14s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.view-tab.active{color:var(--a);border-bottom-color:var(--a)}

/* ── COL FILTERS ──────────────────────────────────────── */
.col-filters{display:flex;gap:0.2rem;padding:0.35rem 1rem;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--bg);align-items:center;flex-wrap:wrap}
.cf-group{display:inline-flex;align-items:center;gap:1px;flex-shrink:0}
.cf{font-family:'DM Mono',monospace;font-size:0.41rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.2rem 0.44rem;border-radius:20px 0 0 20px;border:1px solid var(--b);border-right:none;color:var(--tm);cursor:pointer;transition:all 0.13s;-webkit-tap-highlight-color:transparent}
.cf.on{background:var(--a-dim);color:var(--a);border-color:transparent}
.cf-edit{font-family:'DM Mono',monospace;font-size:0.52rem;padding:0.2rem 0.38rem;border-radius:0 20px 20px 0;border:1px solid var(--b);border-left:none;color:var(--td);cursor:pointer;transition:all 0.13s;background:transparent;line-height:1;-webkit-tap-highlight-color:transparent}
.cf.on+.cf-edit{border-color:transparent;background:var(--a-dim);color:var(--a)}
.cf-edit:hover{color:var(--a)}

/* ── ALL-DAY BAND (auto-height, prominent) ──────────────── */
.allday-band{border-bottom:1px solid var(--b);background:var(--bg2);padding:0.35rem 1rem;flex-shrink:0;display:flex;flex-wrap:wrap;gap:4px}
.allday-band:empty{display:none}
.ad-chip{display:inline-flex;align-items:center;gap:0.28rem;font-size:0.64rem;color:var(--t);padding:0.18rem 0.48rem;border-radius:5px;background:var(--a-dim);border-left:2.5px solid var(--a);white-space:nowrap;line-height:1.4}
.ad-chip.task-chip{border-left-color:var(--tc,#888)}
.ad-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* week allday — auto height */
.wk-ad-gutter{background:var(--bg2);border-bottom:1px solid var(--b);border-right:1px solid var(--b);padding:4px 3px;display:flex;align-items:flex-start;font-family:'DM Mono',monospace;font-size:0.36rem;color:var(--td)}
.wk-ad-cell{background:var(--bg2);border-bottom:1px solid var(--b);border-left:1px solid var(--b);padding:3px;min-height:28px}
.wk-ad-cell.wkend{background:rgba(0,0,0,0.025)}
.wk-ad-cell.drag-over{background:var(--a-dim)}
.wk-ad-chip{font-size:0.54rem;color:var(--t);padding:0.1rem 0.28rem;border-radius:3px;border-left:2.5px solid var(--a);background:var(--a-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;display:block;margin-bottom:2px;line-height:1.4}
.wk-ad-chip.task{border-left-color:var(--tc,#888)}

/* ── DAY VIEW ─────────────────────────────────────────── */
.day-nav{display:flex;align-items:center;justify-content:space-between;padding:0.48rem 1rem;border-bottom:1px solid var(--b);flex-shrink:0}
.nav-arrow{color:var(--tm);font-size:1.1rem;line-height:1;padding:0.22rem 0.4rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.day-date-lbl{font-family:var(--fhead);font-size:1.08rem;font-weight:400;color:var(--t);text-align:center;letter-spacing:0.02em}
.day-dow-lbl{font-family:'DM Mono',monospace;font-size:0.43rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--tm);text-align:center;margin-top:2px}
.tslot{display:flex;align-items:stretch;border-bottom:1px solid var(--b);min-height:36px;flex-shrink:0;position:relative}
.tslot.now-line{border-top:2px solid var(--a)}
.tslot-t{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.04em;color:var(--td);padding:4px 7px 0 9px;width:36px;flex-shrink:0;user-select:none}
.tslot-c{flex:1;padding:2px 4px;display:flex;flex-direction:column;gap:2px}
.tslot-c.drag-over{background:var(--a-dim)}
.cal-item{font-size:0.64rem;color:var(--t);padding:0.16rem 0.42rem;border-radius:4px;border-left:2px solid var(--a);background:var(--a-dim);cursor:grab;user-select:none}
.cal-item.task-item{border-left-color:var(--tc,#888);background:rgba(0,0,0,0.03)}
.cal-item.dragging{opacity:0.35}
.cal-item-sub{font-family:'DM Mono',monospace;font-size:0.36rem;color:var(--td);margin-top:1px}

/* ── WEEK VIEW ────────────────────────────────────────── */
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:0.48rem 1rem;border-bottom:1px solid var(--b);flex-shrink:0}
.week-lbl-txt{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.1em;color:var(--t);text-align:center}
.wk-grid{display:grid;grid-template-columns:28px repeat(7,1fr);flex:1;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.wk-grid::-webkit-scrollbar{width:3px;height:3px}
.wk-grid::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.wk-corner{background:var(--bg);border-bottom:1px solid var(--b);border-right:1px solid var(--b);position:sticky;top:0;z-index:4}
.wk-dh{padding:0.3rem 0.1rem;text-align:center;border-bottom:1px solid var(--b);border-left:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:3;cursor:pointer;transition:background 0.12s}
.wk-dh:hover{background:var(--a-dim)}
.wk-dh.today-col{background:var(--a-dim)}
.wk-dh.wkend{background:rgba(0,0,0,0.022)}
.wk-dn{font-family:'DM Mono',monospace;font-size:0.39rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--tm)}
.wk-num{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--tm);margin-top:1px;display:inline-block}
.wk-num.today{width:20px;height:20px;border-radius:50%;background:var(--a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:0.58rem}
.wk-gut{font-family:'DM Mono',monospace;font-size:0.38rem;color:var(--td);padding:2px 2px 0;border-bottom:1px solid var(--b);border-right:1px solid var(--b);min-height:34px;display:flex;align-items:flex-start}
.wk-cell{border-left:1px solid var(--b);border-bottom:1px solid var(--b);min-height:34px;padding:1px;overflow:hidden;position:relative}
.wk-cell.today-col{background:rgba(90,80,255,0.02)}
.wk-cell.wkend{background:rgba(0,0,0,0.018)}
.wk-cell.now-cell{border-top:2px solid var(--a)}
.wk-cell.drag-over{background:var(--a-dim)}
.wk-ev{font-size:0.53rem;color:var(--t);padding:0.08rem 0.22rem;border-radius:3px;border-left:2px solid var(--a);background:var(--a-dim);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;display:block}
.wk-ev.task{border-left-color:var(--tc,#888)}
.wk-ev.dragging{opacity:0.35}

/* ── MINI CAL ─────────────────────────────────────────── */
.mini-cal-wrap{padding:1rem 1.1rem;flex:1;overflow-y:auto}
.mc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.65rem}
.mc-nav-btn{color:var(--tm);font-size:1rem;padding:0.2rem 0.36rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mc-nav-title{font-family:var(--fhead);font-size:0.9rem;font-weight:400;letter-spacing:0.06em;color:var(--t)}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc-dn{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.08em;color:var(--td);text-align:center;padding:0.2rem 0}
.mc-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--tm);border-radius:50%;cursor:pointer;position:relative;transition:background 0.12s;-webkit-tap-highlight-color:transparent}
.mc-cell:hover{background:var(--a-dim)}
.mc-cell.today{background:var(--a);color:#fff}
.mc-cell.sel{outline:2px solid var(--a);outline-offset:1px}
.mc-cell.other{color:var(--td);opacity:0.36;cursor:default}
.mc-cell.wkend{opacity:0.65}
.mc-cell.hase::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--a)}
.mc-cell.today::after{background:#fff}
.mc-day-evs{margin-top:1rem;border-top:1px solid var(--b);padding-top:0.75rem}
.mc-day-lbl{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--td);margin-bottom:0.4rem}
.mc-ev{font-size:0.66rem;color:var(--t);padding:0.2rem 0.48rem;border-radius:4px;border-left:2px solid var(--a);background:var(--a-dim);margin-bottom:3px}

/* ── WORKSPACE (NOTES) ───────────────────────────────── */
.workspace{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ws-toolbar{display:flex;align-items:center;gap:0.26rem;padding:0.44rem 1.2rem;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--bg);flex-wrap:wrap}
.ws-btn{display:inline-flex;align-items:center;gap:0.2rem;font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.24rem 0.5rem;border-radius:6px;border:1px solid var(--b);color:var(--tm);cursor:pointer;transition:all 0.14s;white-space:nowrap}
.ws-btn:hover{border-color:var(--a);color:var(--a);background:var(--a-dim)}
.ws-btn.primary{background:var(--a-dim);color:var(--a);border-color:transparent}
.ws-no-proj{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.14em;color:var(--td);text-align:center;padding:2rem 1rem}
.ws-columns{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:0;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.ws-columns::-webkit-scrollbar{height:4px}
.ws-columns::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.ws-col{flex:0 0 320px;min-width:220px;max-width:580px;border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ws-col:last-child{border-right:none}
.ws-col-resize{position:absolute;right:0;top:0;bottom:0;width:4px;cursor:col-resize;z-index:5;background:transparent;transition:background 0.15s}
.ws-col-resize:hover,.ws-col-resize.active{background:var(--a)}
.ws-col-head{display:flex;align-items:center;gap:0.4rem;padding:0.52rem 0.85rem 0.38rem;border-bottom:1px solid var(--b);background:var(--bg2);flex-shrink:0}
.ws-col-title{flex:1;font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--tm);background:transparent;border:none;outline:none;cursor:text}
.ws-col-acts{display:flex;gap:0.08rem;opacity:0;transition:opacity 0.12s}

<script>
// ═══ CONFIG ═══════════════════════════════════════════════
const GOOGLE_CLIENT_ID = "145346267905-u5kp69krcatn2drjfcs6uvnl5ll799qi.apps.googleusercontent.com";
const GOOGLE_API_KEY   = "AIzaSyC41lDXe-vaU2WFUEPw3GgWB5wg_5stHYc";
const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1gHaQ7Bw0Oy3XIBrGgG80jKBh2TlWcd5fN1HBLgGEywE/edit";
const DRIVE_FOLDER_PATH = "My Drive/DRIVE RICARDO/RIMA NOTES"; // for export
const PROJ_COLORS=['#5a50ff','#e05a8a','#2196f3','#4caf50','#ff9800','#9c27b0','#00bcd4','#795548'];
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_S=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DAYS_M=['D','S','T','Q','Q','S','S'];
// ══════════════════════════════════════════════════════════

function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch{return d;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}

let allTasks  = lsGet('st_tasks_v3',[]);
let projects  = lsGet('st_proj_v3',[]);
let timeLog   = lsGet('st_tlog_v3',[]);
let wsData    = lsGet('st_ws_v3',{});     // {catId_projIdx: {cols:[]}}
let calFilters= lsGet('st_calfilters_v2',{});
// col widths: {catId: {day: px, weekNotes: px}}
let colWidths = lsGet('st_colwidths',{});

let currentCat=null, currentDay=new Date(), sortMode='manual';
let activeProj=null, showAllTasks=true; // default: show all tasks
let googleReady=false, tokenClient=null, accessToken=null;
let gcalEvs={}, gcalLists=[], gTaskLists={}, gTaskListsAll=[];
let ttProjIdx=null, ttRunning=false, ttStartTs=null, ttElapsed=0, ttInt=null, ttOpen=false;
let mmDate=new Date();
let editTaskId=null, pmProjIdx=null, editTaskCb=null;
let selColor=PROJ_COLORS[0];
let dragCalItem=null, dragWkItem=null, dragBlock=null;
let miniCalDate={art:new Date(),music:new Date()};
let cfeContext=null, cfeSelected=[];
let weekNotesTab='week'; // 'week' | 'notes'

// ── INIT ──────────────────────────────────────────────────
window.onload=()=>{
  document.getElementById('home-date').textContent=
    new Date().toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'2-digit'});

    if(e.key==='t'||e.key==='T') goToday();
    if(e.key==='ArrowLeft') shiftDay(-1);
    if(e.key==='ArrowRight') shiftDay(1);
  });
};

function refreshBadges(){
  ['rima','home','art','music'].forEach(id=>{
    const n=allTasks.filter(t=>t.catId===id&&!t.done&&!t.archived&&!t.onHold).length;
    const el=document.getElementById('badge-'+id);
    if(el) el.textContent=n+' tarefa'+(n!==1?'s':'');
  });
}

function updateHomeGoogleBtn(){
  const btn=document.getElementById('home-google-btn');
  const lbl=document.getElementById('home-google-label');
  if(accessToken){btn.classList.add('connected');lbl.textContent='Google Ligado';}
  else{btn.classList.remove('connected');lbl.textContent='Ligar Google';}
}

// ── GOOGLE ────────────────────────────────────────────────
function initGoogle(){
  gapi.load('client',async()=>{
    await gapi.client.init({apiKey:GOOGLE_API_KEY,discoveryDocs:[
      'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest',
      'https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest',
      'https://www.googleapis.com/discovery/v1/apis/docs/v1/rest',
      'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
    ]});
    googleReady=true;
  });
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive',
    callback:async r=>{
      if(r.error) return;
      accessToken=r.access_token;
      document.getElementById('auth-banner').classList.add('hidden');
      updateHomeGoogleBtn();
      await loadAllCalendars();
      await loadAllTaskLists();
      if(currentCat){
        await loadGCal(currentCat);
        await syncTaskLists();
        renderCal(); renderTasks();
      }
    }
  });
}
function signIn(){tokenClient.requestAccessToken();}

async function loadAllCalendars(){
  if(!accessToken||!googleReady) return;
  try{const r=await gapi.client.calendar.calendarList.list({maxResults:50});gcalLists=(r.result.items||[]).map(c=>({id:c.id,name:c.summary,color:c.backgroundColor}));}
  catch(e){console.warn(e);}
}
async function loadAllTaskLists(){
  if(!accessToken||!googleReady) return;
  try{const r=await gapi.client.tasks.tasklists.list({maxResults:100});gTaskListsAll=(r.result.items||[]).map(l=>({id:l.id,name:l.title}));}
  catch(e){console.warn(e);}
}
async function loadGCal(catId){
  if(!accessToken||!googleReady) return;
  const f=calFilters[catId]||{};
  const ids=[...new Set([...(f.day?.event||[]),...(f.day?.routine||[]),...(f.week?.event||[]),...(f.week?.routine||[])])];
  if(!ids.length) return;
  gcalEvs[catId]=[];
  const now=new Date();
  const tMin=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString();
  const tMax=new Date(now.getFullYear(),now.getMonth()+3,0).toISOString();
  for(const cid of ids){
    try{
      const r=await gapi.client.calendar.events.list({calendarId:cid,timeMin:tMin,timeMax:tMax,singleEvents:true,orderBy:'startTime',maxResults:300});
      (r.result.items||[]).forEach(e=>gcalEvs[catId].push({id:e.id,title:e.summary||'',start:e.start.dateTime||e.start.date,end:e.end.dateTime||e.end.date,calId:cid}));
    }catch(err){console.warn(err);}
  }
}
async function syncTaskLists(){
  if(!accessToken||!googleReady) return;
  try{
    const r=await gapi.client.tasks.tasklists.list({maxResults:100});
    const lists=r.result.items||[];
    gTaskListsAll=lists.map(l=>({id:l.id,name:l.title}));
    for(let i=0;i<projects.length;i++){
      let list=lists.find(l=>l.title===projects[i].name);
      if(!list){const cr=await gapi.client.tasks.tasklists.insert({title:projects[i].name});list=cr.result;}
      gTaskLists[i]=list.id;
      await pullProjTasks(i,list.id);
    }
  }catch(e){console.warn(e);}
}
async function pullProjTasks(projIdx,listId){
  if(!accessToken||!googleReady||!listId) return;
  try{
    const r=await gapi.client.tasks.tasks.list({tasklist:listId,maxResults:200,showCompleted:true,showHidden:false});
    (r.result.items||[]).forEach(gt=>{
      const ex=allTasks.find(t=>t.gTaskId===gt.id);
      if(ex){ex.title=gt.title;ex.done=gt.status==='completed';ex.date=gt.due?gt.due.slice(0,10):ex.date;}
      else allTasks.push({id:'gt_'+gt.id,gTaskId:gt.id,title:gt.title,catId:currentCat,projIdx,done:gt.status==='completed',date:gt.due?gt.due.slice(0,10):null,time:null,notes:gt.notes||'',order:allTasks.length,onHold:false});
    });
    lsSet('st_tasks_v3',allTasks);
  }catch(e){console.warn(e);}
}
async function pushTask(task){
  if(!accessToken||!googleReady) return;
  const listId=task.projIdx!=null?gTaskLists[task.projIdx]:null;if(!listId) return;
  try{
    if(task.gTaskId) await gapi.client.tasks.tasks.patch({tasklist:listId,task:task.gTaskId},{title:task.title,status:task.done?'completed':'needsAction',due:task.date?new Date(task.date+'T12:00').toISOString():undefined,notes:task.notes||undefined});
    else{const r=await gapi.client.tasks.tasks.insert({tasklist:listId},{title:task.title,status:'needsAction',due:task.date?new Date(task.date+'T12:00').toISOString():undefined});task.gTaskId=r.result.id;lsSet('st_tasks_v3',allTasks);}
  }catch(e){console.warn(e);}
}
async function deleteGTask(task){
  if(!accessToken||!googleReady||!task.gTaskId) return;
  const listId=task.projIdx!=null?gTaskLists[task.projIdx]:null;if(!listId) return;
  try{await gapi.client.tasks.tasks.delete({tasklist:listId,task:task.gTaskId});}catch(e){console.warn(e);}
}

// Find or create folder in Drive and return its ID
async function findOrCreateFolder(path){
  if(!accessToken||!googleReady) return null;
  const parts=path.split('/').filter(Boolean);
  let parentId='root';
  for(const name of parts){
    try{
      const q=`name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
      const r=await gapi.client.drive.files.list({q,fields:'files(id,name)',pageSize:1});
      if(r.result.files&&r.result.files.length>0){parentId=r.result.files[0].id;}
      else{
        const cr=await gapi.client.drive.files.create({resource:{name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]},fields:'id'});
        parentId=cr.result.id;
      }
    }catch(e){console.warn(e);return null;}
  }
  return parentId;
}

function openCat(id){
  currentCat=id; currentDay=new Date(); activeProj=null; sortMode='manual'; showAllTasks=true;
  weekNotesTab='week';

  document.getElementById('cat-lbl').textContent=id.toUpperCase();
  const banner=document.getElementById('auth-banner');
  !accessToken?banner.classList.remove('hidden'):banner.classList.add('hidden');
  buildTopbarActions(id);
  buildPillsRow(id);

function mkResizer(col,key,id,cw){
  const r=document.createElement('div');r.className='col-resizer';
  let startX=0,startW=0;
  r.addEventListener('mousedown',e=>{
    e.preventDefault();startX=e.clientX;startW=col.offsetWidth;r.classList.add('active');
    const mm=ev=>{const nw=Math.max(200,startW+(ev.clientX-startX));col.style.width=nw+'px';cw[key]=nw;};
    const mu=()=>{r.classList.remove('active');document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);colWidths[id]=cw;lsSet('st_colwidths',colWidths);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  // Touch support
  r.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startW=col.offsetWidth;r.classList.add('active');});
  r.addEventListener('touchmove',e=>{const nw=Math.max(200,startW+(e.touches[0].clientX-startX));col.style.width=nw+'px';cw[key]=nw;});
  r.addEventListener('touchend',()=>{r.classList.remove('active');colWidths[id]=cw;lsSet('st_colwidths',colWidths);});
  return r;
}

function handleRHResponsive(dayCol,wkCol,tkCol,r1,r2){

    const w=window.innerWidth;
    if(w<=600){wkCol.style.display='none';tkCol.style.display='none';r1.style.display='none';r2.style.display='none';}
    else if(w<=980){tkCol.style.display='none';r2.style.display='none';wkCol.style.display='flex';r1.style.display='block';}
    else{wkCol.style.display='flex';tkCol.style.display='flex';r1.style.display='block';r2.style.display='block';}
  };
  apply();window.addEventListener('resize',apply);
}

function getCalIds(col,type){return (calFilters[currentCat]?.[col]?.[type])||[];}
function getAllDayItems(ds,col){
  const f=col==='day'?dayFilters:weekFilters;
  const evIds=getCalIds(col,'event'),rtIds=getCalIds(col,'routine');
  const items=[];
  if(f.event)(gcalEvs[currentCat]||[]).filter(e=>e.start.slice(0,10)===ds&&!e.start.includes('T')&&(!evIds.length||evIds.includes(e.calId))).forEach(e=>items.push({type:'event',id:e.id,title:e.title,color:null}));
  if(f.routine)(gcalEvs[currentCat]||[]).filter(e=>e.start.slice(0,10)===ds&&!e.start.includes('T')&&(!rtIds.length||rtIds.includes(e.calId))&&!items.find(x=>x.id===e.id)).forEach(e=>items.push({type:'routine',id:e.id,title:e.title,color:null}));
  if(f.task) allTasks.filter(t=>t.catId===currentCat&&!t.archived&&t.date===ds&&!t.time&&!t.done&&!t.onHold).forEach(t=>{const p=t.projIdx!=null?projects[t.projIdx]:null;items.push({type:'task',id:t.id,title:t.title,color:p?.color||null});});
  return items;
}
function getTimedItems(ds,h,col){
  const f=col==='day'?dayFilters:weekFilters;
  const evIds=getCalIds(col,'event'),rtIds=getCalIds(col,'routine');
  const items=[];
  if(f.event)(gcalEvs[currentCat]||[]).filter(e=>e.start.slice(0,10)===ds&&e.start.includes('T')&&parseInt(e.start.split('T')[1]?.slice(0,2))===h&&(!evIds.length||evIds.includes(e.calId))).forEach(e=>items.push({type:'event',id:e.id,title:e.title,time:e.start.split('T')[1]?.slice(0,5)||'',color:null}));
  if(f.routine)(gcalEvs[currentCat]||[]).filter(e=>e.start.slice(0,10)===ds&&e.start.includes('T')&&parseInt(e.start.split('T')[1]?.slice(0,2))===h&&(!rtIds.length||rtIds.includes(e.calId))&&!items.find(x=>x.id===e.id)).forEach(e=>items.push({type:'routine',id:e.id,title:e.title,time:e.start.split('T')[1]?.slice(0,5)||'',color:null}));
  if(f.task) allTasks.filter(t=>t.catId===currentCat&&!t.archived&&t.date===ds&&t.time&&!t.done&&!t.onHold&&parseInt(t.time.slice(0,2))===h).forEach(t=>{const p=t.projIdx!=null?projects[t.projIdx]:null;items.push({type:'task',id:t.id,title:t.title,time:t.time,color:p?.color||null});});
  return items;
}

// ── CAL RENDER ─────────────────────────────────────────────
function renderCal(){renderDayView();renderWeekView();}

function renderDayView(){
  const dlbl=document.getElementById('day-date-lbl');if(!dlbl) return;
  dlbl.textContent=currentDay.getDate()+' '+MONTHS[currentDay.getMonth()];
  document.getElementById('day-dow-lbl').textContent=DAYS_S[currentDay.getDay()];
  const ds=toDS(currentDay);const now=new Date();const today=currentDay.toDateString()===now.toDateString();
  const band=document.getElementById('day-allday');band.innerHTML='';
  getAllDayItems(ds,'day').forEach(item=>{
    const chip=document.createElement('div');chip.className='ad-chip'+(item.type==='task'?' task-chip':'');
    if(item.color){chip.style.setProperty('--a',item.color);chip.style.setProperty('--tc',item.color);}
    if(item.type==='task') chip.innerHTML=`<span class="ad-dot" style="background:${item.color||'#888'}"></span>${escHtml(item.title)}`;
    else chip.textContent=item.title;
    band.appendChild(chip);
  });
  const slots=document.getElementById('day-slots');slots.innerHTML='';
  for(let h=7;h<=23;h++){
    const isNow=today&&h===now.getHours();
    const slot=document.createElement('div');slot.className='tslot'+(isNow?' now-line':'');slot.dataset.h=h;slot.dataset.ds=ds;
    const t=document.createElement('div');t.className='tslot-t';t.textContent=h.toString().padStart(2,'0')+':00';
    const cont=document.createElement('div');cont.className='tslot-c';
    getTimedItems(ds,h,'day').forEach(item=>cont.appendChild(mkCalItem(item,ds,h)));
    cont.addEventListener('dragover',e=>{e.preventDefault();cont.classList.add('drag-over');});
    cont.addEventListener('dragleave',()=>cont.classList.remove('drag-over'));
    cont.addEventListener('drop',e=>{
      e.preventDefault();cont.classList.remove('drag-over');
      if(!dragCalItem||dragCalItem.type!=='task') return;
      const tk=allTasks.find(x=>x.id===dragCalItem.id);
      if(tk){tk.date=ds;tk.time=h.toString().padStart(2,'0')+':00';lsSet('st_tasks_v3',allTasks);pushTask(tk);}
      dragCalItem=null;renderCal();
    });
    slot.appendChild(t);slot.appendChild(cont);slots.appendChild(slot);
  }
  updateTodayBtn();
}
function mkCalItem(item,ds,h){
  const el=document.createElement('div');el.className='cal-item'+(item.type==='task'?' task-item':'');
  if(item.color) el.style.setProperty('--tc',item.color);
  el.draggable=item.type==='task';
  el.innerHTML=escHtml(item.title)+(item.time?`<div class="cal-item-sub">${item.time}</div>`:'');
  if(item.type==='task'){
    el.addEventListener('dragstart',e=>{dragCalItem={...item};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  }
  return el;
}
function shiftDay(d){currentDay=new Date(currentDay);currentDay.setDate(currentDay.getDate()+d);renderDayView();updateTodayBtn();}

function renderWeekView(){
  const grid=document.getElementById('wk-grid');if(!grid) return;
  grid.innerHTML='';
  const now=new Date();
  const ws=new Date(currentDay);ws.setDate(currentDay.getDate()-1);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d;});
  document.getElementById('week-lbl').textContent=`${days[0].getDate()} ${MONTHS[days[0].getMonth()].slice(0,3)} — ${days[6].getDate()} ${MONTHS[days[6].getMonth()].slice(0,3)}`;
  const isWknd=d=>[0,6].includes(d.getDay());
  grid.style.gridTemplateRows='auto auto repeat(16,minmax(34px,1fr))';
  // Corner
  const corner=document.createElement('div');corner.className='wk-corner';corner.style='grid-row:1;grid-column:1';grid.appendChild(corner);
  // Headers
  days.forEach((d,i)=>{
    const isT=d.toDateString()===now.toDateString();const wknd=isWknd(d);
    const hd=document.createElement('div');hd.className='wk-dh'+(isT?' today-col':'')+(wknd?' wkend':'');hd.style=`grid-row:1;grid-column:${i+2}`;
    hd.innerHTML=`<div class="wk-dn">${DAYS_S[d.getDay()].slice(0,3)}</div><div class="wk-num${isT?' today':''}">${d.getDate()}</div>`;
    hd.onclick=()=>{currentDay=new Date(d);renderDayView();updateTodayBtn();};
    grid.appendChild(hd);
  });
  // All-day row — auto height
  const adGut=document.createElement('div');adGut.className='wk-ad-gutter';adGut.style='grid-row:2;grid-column:1';adGut.textContent='↓';grid.appendChild(adGut);
  days.forEach((d,i)=>{
    const ds=toDS(d);const wknd=isWknd(d);
    const cell=document.createElement('div');cell.className='wk-ad-cell'+(wknd?' wkend':'');cell.style=`grid-row:2;grid-column:${i+2}`;
    getAllDayItems(ds,'week').forEach(item=>{
      const chip=document.createElement('div');chip.className='wk-ad-chip'+(item.type==='task'?' task':'');
      if(item.color) chip.style.setProperty('--tc',item.color);
      chip.textContent=item.title;chip.draggable=item.type==='task';
      if(item.type==='task'){
        chip.addEventListener('dragstart',e=>{dragWkItem={...item,ds,allDay:true};chip.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
        chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
      }
      cell.appendChild(chip);
    });
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-over');});
    cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
    cell.addEventListener('drop',e=>{
      e.preventDefault();cell.classList.remove('drag-over');
      if(!dragWkItem||dragWkItem.type!=='task') return;
      const tk=allTasks.find(x=>x.id===dragWkItem.id);
      if(tk){tk.date=ds;tk.time=null;lsSet('st_tasks_v3',allTasks);pushTask(tk);}
      dragWkItem=null;renderWeekView();renderDayView();
    });
    grid.appendChild(cell);
  });
  // Hour rows
  for(let h=7;h<=22;h++){
    const row=h-7+3;
    const gut=document.createElement('div');gut.className='wk-gut';gut.style=`grid-row:${row};grid-column:1`;gut.textContent=h.toString().padStart(2,'0');grid.appendChild(gut);
    days.forEach((d,i)=>{
      const ds=toDS(d);const isT=d.toDateString()===now.toDateString();const wknd=isWknd(d);const isNow=isT&&now.getHours()===h;
      const cell=document.createElement('div');cell.className='wk-cell'+(isT?' today-col':'')+(wknd?' wkend':'')+(isNow?' now-cell':'');cell.style=`grid-row:${row};grid-column:${i+2}`;cell.dataset.ds=ds;cell.dataset.h=h;
      getTimedItems(ds,h,'week').forEach(item=>{
        const ev=document.createElement('div');ev.className='wk-ev'+(item.type==='task'?' task':'');
        if(item.color) ev.style.setProperty('--tc',item.color);
        ev.textContent=item.title;ev.draggable=item.type==='task';
        if(item.type==='task'){
          ev.addEventListener('dragstart',e=>{dragWkItem={...item,origDs:ds,origH:h};ev.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
          ev.addEventListener('dragend',()=>ev.classList.remove('dragging'));
        }
        cell.appendChild(ev);
      });
      cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-over');});
      cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
      cell.addEventListener('drop',e=>{
        e.preventDefault();cell.classList.remove('drag-over');
        if(!dragWkItem||dragWkItem.type!=='task') return;
        const tk=allTasks.find(x=>x.id===dragWkItem.id);
        if(tk){tk.date=ds;tk.time=h.toString().padStart(2,'0')+':00';lsSet('st_tasks_v3',allTasks);pushTask(tk);}
        dragWkItem=null;renderWeekView();renderDayView();
      });
      grid.appendChild(cell);
    });
  }
}
function shiftWeek(d){currentDay=new Date(currentDay);currentDay.setDate(currentDay.getDate()+d*7);renderWeekView();updateTodayBtn();}

// ── MINI CAL ────────────────────────────────────────────────
function renderMiniCal(id){
  const wrap=document.getElementById('mini-cal-'+id);if(!wrap) return;
  const d=miniCalDate[id];const y=d.getFullYear(),m=d.getMonth();const now=new Date();
  wrap.innerHTML='';
  const nav=document.createElement('div');nav.className='mc-nav';
  nav.innerHTML=`<button class="mc-nav-btn" onclick="shiftMC('${id}',-1)">‹</button><div class="mc-nav-title">${MONTHS[m].slice(0,3)} ${y}</div><button class="mc-nav-btn" onclick="shiftMC('${id}',1)">›</button>`;
  wrap.appendChild(nav);
  const grid=document.createElement('div');grid.className='mc-grid';
  DAYS_M.forEach(dn=>{const el=document.createElement('div');el.className='mc-dn';el.textContent=dn;grid.appendChild(el);});
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dip=new Date(y,m,0).getDate();
  const evDates=new Set((gcalEvs[id]||[]).filter(e=>{const ed=new Date(e.start.slice(0,10));return ed.getFullYear()===y&&ed.getMonth()===m;}).map(e=>parseInt(e.start.slice(8,10))));
  for(let i=fd-1;i>=0;i--){const el=document.createElement('div');el.className='mc-cell other';el.textContent=dip-i;grid.appendChild(el);}
  for(let dn=1;dn<=dim;dn++){
    const el=document.createElement('div');
    const isT=dn===now.getDate()&&m===now.getMonth()&&y===now.getFullYear();
    const isSel=dn===currentDay.getDate()&&m===currentDay.getMonth()&&y===currentDay.getFullYear();
    const wknd=[0,6].includes(new Date(y,m,dn).getDay());
    let cls='mc-cell';if(isT) cls+=' today';else if(isSel) cls+=' sel';if(evDates.has(dn)) cls+=' hase';if(wknd) cls+=' wkend';
    el.className=cls;el.textContent=dn;el.onclick=()=>{currentDay=new Date(y,m,dn);renderMiniCal(id);};
    grid.appendChild(el);
  }
  const rem=(fd+dim)%7===0?0:7-(fd+dim)%7;
  for(let dn=1;dn<=rem;dn++){const el=document.createElement('div');el.className='mc-cell other';el.textContent=dn;grid.appendChild(el);}
  wrap.appendChild(grid);
  const evWrap=document.createElement('div');evWrap.className='mc-day-evs';
  const ds=toDS(currentDay);
  const dayEvs=(gcalEvs[id]||[]).filter(e=>e.start.slice(0,10)===ds);
  if(dayEvs.length){
    const lbl=document.createElement('div');lbl.className='mc-day-lbl';lbl.textContent=DAYS_S[currentDay.getDay()]+' '+currentDay.getDate()+' '+MONTHS[currentDay.getMonth()].slice(0,3);
    evWrap.appendChild(lbl);dayEvs.forEach(e=>{const ev=document.createElement('div');ev.className='mc-ev';ev.textContent=e.title;evWrap.appendChild(ev);});
  }
  wrap.appendChild(evWrap);
}

async function wsExportDoc(wsKey,docTitle){
  if(!accessToken||!googleReady){alert('Liga o Google para exportar.');return;}
  const cols=wsData[wsKey]?.cols||[];if(!cols.length){alert('Workspace vazio.');return;}
  let text=docTitle+' — '+new Date().toLocaleDateString('pt-PT')+'\n\n';
  cols.forEach(col=>{
    text+='=== '+col.title+' ===\n\n';
    col.blocks.forEach(b=>{
      text+=b.title+'\n';
      if(b.type==='checklist') b.items.forEach(i=>text+=(i.done?'✓ ':'☐ ')+i.text+'\n');
      else if(b.type==='list') b.items.forEach(i=>text+='• '+i+'\n');
      else if(b.type==='note') text+=(b.text||'')+'\n';
      else if(b.type==='table'){text+=b.headers.join(' | ')+'\n';b.data.forEach(r=>text+=r.join(' | ')+'\n');}
      text+='\n';
    });
  });
  try{
    // Find/create folder
    let parents=['root'];
    if(wsKey.startsWith('rima_')){
      const folderId=await findOrCreateFolder(DRIVE_FOLDER_PATH);
      if(folderId) parents=[folderId];
    }
    const dr=await gapi.client.docs.documents.create({title:docTitle+' — '+new Date().toLocaleDateString('pt-PT')});
    const docId=dr.result.documentId;
    await gapi.client.docs.documents.batchUpdate({documentId:docId},{requests:[{insertText:{location:{index:1},text}}]});
    // Move to folder
    if(parents[0]!=='root'){
      await gapi.client.drive.files.update({fileId:docId,addParents:parents[0],removeParents:'root',fields:'id,parents'});
    }
    window.open('https://docs.google.com/document/d/'+docId+'/edit','_blank');
  }catch(e){alert('Erro: '+e.message);}
}

// ── TASKS ─────────────────────────────────────────────────
function toggleShowAll(){
  showAllTasks=!showAllTasks;
  document.getElementById('show-all-btn')?.classList.toggle('active',showAllTasks);
  renderTasks();
}
function getCatTasks(){
  let ts=allTasks.filter(t=>t.catId===currentCat&&!t.archived);
  if(!showAllTasks&&activeProj!==null) ts=ts.filter(t=>t.projIdx===activeProj);
  if(sortMode==='date') ts=[...ts].sort((a,b)=>(!a.date&&!b.date)?0:!a.date?1:!b.date?-1:a.date.localeCompare(b.date));
  else if(sortMode==='proj') ts=[...ts].sort((a,b)=>(a.projIdx??999)-(b.projIdx??999));
  else ts=[...ts].sort((a,b)=>(a.order??0)-(b.order??0));
  return ts;
}
function renderTasks(){
  const body=document.getElementById('tasks-body');if(!body) return;
  const titleEl=document.getElementById('tasks-col-title');
  if(titleEl) titleEl.textContent=(!showAllTasks&&activeProj!==null&&projects[activeProj])?projects[activeProj].name:'Tarefas';
  const tasks=getCatTasks();
  const active=tasks.filter(t=>!t.done&&!t.onHold);
  const onHold=tasks.filter(t=>t.onHold&&!t.done);
  const done=tasks.filter(t=>t.done);
  body.innerHTML='';
  if(!active.length&&!onHold.length&&!done.length){body.innerHTML='<div class="tasks-empty">Sem tarefas.</div>';return;}
  if(active.length){const lbl=document.createElement('div');lbl.className='task-sec-lbl';lbl.textContent='Por fazer';body.appendChild(lbl);active.forEach(t=>body.appendChild(mkTaskRow(t)));}
  if(onHold.length){
    const sec=document.createElement('div');sec.className='hold-section';
    const tog=document.createElement('div');tog.className='hold-toggle';tog.innerHTML=`Em espera (${onHold.length})<span class="done-chev">▾</span>`;tog.onclick=()=>sec.classList.toggle('open');
    const lst=document.createElement('div');lst.className='hold-list';onHold.forEach(t=>lst.appendChild(mkTaskRow(t)));
    sec.appendChild(tog);sec.appendChild(lst);body.appendChild(sec);
  }
  if(done.length){
    const sec=document.createElement('div');sec.className='done-section';
    const tog=document.createElement('div');tog.className='done-toggle';tog.innerHTML=`Concluídas (${done.length})<span class="done-chev">▾</span>`;tog.onclick=()=>sec.classList.toggle('open');
    const lst=document.createElement('div');lst.className='done-list';done.forEach(t=>lst.appendChild(mkTaskRow(t)));
    sec.appendChild(tog);sec.appendChild(lst);body.appendChild(sec);
  }
}
function mkTaskRow(task){
  const gi=allTasks.indexOf(task);
  const proj=task.projIdx!=null?projects[task.projIdx]:null;
  const color=proj?.color||'transparent';
  const row=document.createElement('div');row.className='task-row'+(task.done?' done':'')+(task.onHold?' on-hold':'');
  row.draggable=sortMode==='manual'&&!task.done&&!task.onHold;row.dataset.gi=gi;
  let dateLbl='';
  if(task.date){const d=new Date(task.date+'T12:00');const ov=!task.done&&d<new Date()&&d.toDateString()!==new Date().toDateString();dateLbl=`<span class="t-date${ov?' ov':''}">📅 ${d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})}${task.time?' '+task.time:''}</span>`;}
  const projTag=proj?`<span class="t-proj" style="background:${color}18;color:${color}">${escHtml(proj.name)}</span>`:'';
  row.innerHTML=`<div class="drag-h">⠿</div><div class="t-bar" style="background:${color==='transparent'?'var(--b)':color}"></div>
    <div class="t-chk" onclick="toggleTask(event,${gi})"></div>
    <div class="t-main"><div class="t-txt">${escHtml(task.title)}</div><div class="t-meta">${projTag}${dateLbl}</div></div>
    <div class="t-acts">
      <span class="t-act hold-act" onclick="toggleHold(event,${gi})" title="On hold">⏸</span>
      <span class="t-act" onclick="openEditTask(event,${gi})">✏︎</span>
      <span class="t-act" onclick="deleteTask(event,${gi})">✕</span>
    </div>`;
  if(!task.done&&!task.onHold&&sortMode==='manual'){
    let dgi=null;
    row.addEventListener('dragstart',e=>{dgi=gi;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('.task-row').forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();row.classList.remove('drag-over');
      if(dgi===null||dgi===gi) return;
      const si=allTasks.findIndex((_,i)=>i===dgi),di=allTasks.findIndex((_,i)=>i===gi);
      if(si===-1||di===-1) return;
      const[mv]=allTasks.splice(si,1);allTasks.splice(di,0,mv);allTasks.forEach((t,i)=>t.order=i);dgi=null;
      lsSet('st_tasks_v3',allTasks);renderTasks();
    });
  }
  return row;
}

  const y=mmDate.getFullYear(),m=mmDate.getMonth(),now=new Date();

    ...allTasks.filter(t=>t.catId===currentCat&&t.date&&!t.archived).map(t=>{const d=new Date(t.date+'T12:00');return d.getFullYear()===y&&d.getMonth()===m?d.getDate():null;}).filter(Boolean),
  ]);
  for(let i=fd-1;i>=0;i--){const el=document.createElement('div');el.className='mcal-cell other';el.textContent=dip-i;grid.appendChild(el);}
  for(let d=1;d<=dim;d++){
    const el=document.createElement('div');

  const evWrap=document.getElementById('mm-evs');evWrap.innerHTML='';

// ── UTILS ──────────────────────────────────────────────────
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return [h,m,sc].map(v=>v.toString().padStart(2,'0')).join(':');}
function fmtH(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h+'h '+m.toString().padStart(2,'0')+'m';}
function toDS(d){return d.toISOString().slice(0,10);}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hexRgba(hex,a){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}catch{return `rgba(90,80,255,${a})`;}}
